name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/ICL
            git fetch origin main
            git checkout main
            git pull origin main
            cd frontend
            npm install
            npm run build
            cd ../backend
            npm install
            if grep -q "^CORS_ORIGIN=" .env 2>/dev/null; then
              sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=https://icl-pilates.com,http://localhost:5173|' .env
            else
              echo "CORS_ORIGIN=https://icl-pilates.com,http://localhost:5173" >> .env
            fi
            pm2 restart icl-backend
            sudo cp ~/ICL/deploy/nginx-prod.conf /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo nginx -s reload
