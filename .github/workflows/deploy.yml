name: Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check and test backend
        working-directory: backend
        run: npm run check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 중간 명령이 실패하면 즉시 중단합니다.
            # 이 가드가 없으면 빌드가 깨져도 다음 단계가 이어져 잘못된 배포가 끝까지 진행됩니다.
            set -e
            mkdir -p ~/backups
            if [ -f ~/ICL/backend/.env ]; then
              DB_USER=$(grep "^DB_USER=" ~/ICL/backend/.env | cut -d= -f2)
              DB_PASS=$(grep "^DB_PASSWORD=" ~/ICL/backend/.env | cut -d= -f2)
              DB_NAME=$(grep "^DB_NAME=" ~/ICL/backend/.env | cut -d= -f2)
              mysqldump -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" > ~/backups/db_$(date +%Y%m%d_%H%M%S).sql 2>/dev/null || true
              find ~/backups -name "db_*.sql" -mtime +7 -delete 2>/dev/null || true
            fi
            cd ~/ICL
            git fetch origin main
            git reset --hard origin/main
            if [ -f ~/ICL/backend/.env ]; then
              APPLY_DEPLOY_SEED_OVERRIDES=$(grep "^APPLY_DEPLOY_SEED_OVERRIDES=" ~/ICL/backend/.env | cut -d= -f2- | tr -d '\r' || true)
              if [ "$APPLY_DEPLOY_SEED_OVERRIDES" = "true" ] && [ -f ~/ICL/deploy/seed-overrides.sql ]; then
                echo "Applying deploy/seed-overrides.sql because APPLY_DEPLOY_SEED_OVERRIDES=true"
                DB_USER=$(grep "^DB_USER=" ~/ICL/backend/.env | cut -d= -f2)
                DB_PASS=$(grep "^DB_PASSWORD=" ~/ICL/backend/.env | cut -d= -f2)
                DB_NAME=$(grep "^DB_NAME=" ~/ICL/backend/.env | cut -d= -f2)
                mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" < ~/ICL/deploy/seed-overrides.sql 2>/dev/null
              else
                echo "Skipping deploy/seed-overrides.sql; set APPLY_DEPLOY_SEED_OVERRIDES=true to apply it intentionally"
              fi
            fi
            cd frontend
            npm install
            npm run build
            cd ../backend
            npm install
            if grep -q "^CORS_ORIGIN=" .env 2>/dev/null; then
              sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=https://icl-pilates.com,https://www.icl-pilates.com|' .env
            else
              echo "CORS_ORIGIN=https://icl-pilates.com,https://www.icl-pilates.com" >> .env
            fi
            if ! grep -q "^ACADEMY_PLAYBACK_TOKEN_SECRET=" .env 2>/dev/null; then
              echo "ACADEMY_PLAYBACK_TOKEN_SECRET=$(openssl rand -hex 32)" >> .env
            fi
            pm2 describe icl-backend > /dev/null 2>&1 && pm2 restart icl-backend --update-env || pm2 start src/server.js --name icl-backend --cwd ~/ICL/backend --time
            pm2 save
            # nginx 설정은 배포가 복사하지 않습니다.
            # sites-available/icl 이 deploy/nginx-icl-app.conf 를 include 하므로
            # git reset --hard 로 갱신된 내용을 reload 가 그대로 읽어갑니다.
            # (심볼릭 링크인 sites-enabled/icl 에 cp 하면 certbot 관리 원본이 덮어써집니다)
            sudo nginx -t
            sudo nginx -s reload
