name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p ~/backups
            if [ -f ~/ICL/backend/.env ]; then
              DB_USER=$(grep "^DB_USER=" ~/ICL/backend/.env | cut -d= -f2)
              DB_PASS=$(grep "^DB_PASSWORD=" ~/ICL/backend/.env | cut -d= -f2)
              DB_NAME=$(grep "^DB_NAME=" ~/ICL/backend/.env | cut -d= -f2)
              mysqldump -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" > ~/backups/db_$(date +%Y%m%d_%H%M%S).sql 2>/dev/null || true
              find ~/backups -name "db_*.sql" -mtime +7 -delete 2>/dev/null || true
            fi
            cd ~/ICL
            git fetch origin main
            git reset --hard origin/main
            cd frontend
            npm install
            npm run build
            cd ../backend
            npm install
            if grep -q "^CORS_ORIGIN=" .env 2>/dev/null; then
              sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=https://icl-pilates.com,https://www.icl-pilates.com|' .env
            else
              echo "CORS_ORIGIN=https://icl-pilates.com,https://www.icl-pilates.com" >> .env
            fi
            if ! grep -q "^ACADEMY_PLAYBACK_TOKEN_SECRET=" .env 2>/dev/null; then
              echo "ACADEMY_PLAYBACK_TOKEN_SECRET=$(openssl rand -hex 32)" >> .env
            fi
            pm2 describe icl-backend > /dev/null 2>&1 && pm2 restart icl-backend --update-env || pm2 start src/server.js --name icl-backend --cwd ~/ICL/backend --time
            pm2 save
            sudo cp ~/ICL/deploy/nginx-prod.conf /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo nginx -s reload
