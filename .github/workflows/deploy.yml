name: Deploy to EC2

on:
  push:
    branches:
      - merge

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/ICL
            git pull origin merge
            cd frontend
            npm install
            npm run build
            cd ../backend
            npm install
            pm2 restart icl-backend
