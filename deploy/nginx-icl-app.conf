# 이끌림 필라테스 운영 nginx — 애플리케이션 설정 조각
#
# 이 파일은 server 블록이 아니라 그 안에 들어가는 조각입니다.
# /etc/nginx/sites-available/icl 의 server 블록 안에서 아래 한 줄로 불러 씁니다.
#
#   include /home/ubuntu/ICL/deploy/nginx-icl-app.conf;
#
# TLS(listen 443, ssl_certificate, options-ssl-nginx.conf, ssl_dhparam),
# server_name, root, 80 포트 리다이렉트는 certbot 이 관리하므로 여기에 넣지 않습니다.
# 인증서 경로는 재발급 때마다 바뀔 수 있어(현재 icl-pilates.com-0001),
# 저장소가 그 값을 들고 있으면 배포 시점에 없는 인증서를 가리킬 위험이 있습니다.
#
# 배포는 이 파일을 복사하지 않습니다. git reset --hard 로 갱신된 내용을
# nginx reload 가 그대로 읽어갑니다.

# 교육영상 업로드 상한이 코드상 5GB 입니다.
# (backend/src/features/academy/service/asset.service.js ACADEMY_VIDEO_UPLOAD_MAX_BYTES)
# nginx 가 더 작은 값으로 먼저 413 을 반환하면 코드 상한이 무의미해지므로 맞춰 둡니다.
# 실제 용량 방어는 백엔드가 스트리밍 중에 수행합니다.
client_max_body_size 5120m;

# 영상 파일 직접 접근은 nginx 단계에서 끊습니다.
# 백엔드(app.js 의 denyDirectVideoAccess)도 같은 요청을 403 으로 막지만,
# 여기서 먼저 차단하면 Node 까지 가지 않고, 훗날 /uploads/ 를 정적 서빙으로
# 바꾸더라도 이 블록이 마지막 방어선으로 남습니다.
# 아래 /uploads/ 보다 먼저 선언해야 우선 매칭됩니다.
location /uploads/academy/videos/ {
  return 403;
}

location /api/ {
  proxy_pass http://127.0.0.1:4000;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 5GB 영상 업로드는 회선에 따라 수십 분이 걸립니다.
  # 기본값 60초로는 대용량 업로드가 중간에 끊깁니다.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # 업로드 본문을 디스크에 모아두지 않고 백엔드로 바로 흘려보냅니다.
  # 백엔드가 스트리밍으로 받아 저장하므로 이중 저장이 필요 없습니다.
  proxy_request_buffering off;
}

# 업로드 파일도 백엔드를 거칩니다.
# alias 로 nginx 가 직접 서빙하면 app.js 가 붙이는 X-Content-Type-Options·CSP 가
# 사라지고, 위의 영상 차단도 함께 우회됩니다.
location /uploads/ {
  proxy_pass http://127.0.0.1:4000/uploads/;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Vite 가 파일명에 해시를 붙이므로(index-CfMCilnv.js) 내용이 바뀌면 이름도 바뀝니다.
# 캐시가 오래 남아도 낡은 파일을 보게 될 일이 없습니다.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location / {
  try_files $uri /index.html;
}
