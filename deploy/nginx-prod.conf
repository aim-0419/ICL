# [참고용 보관 파일 — 배포에 사용되지 않습니다]
#
# 이 파일은 더 이상 실서비스에 반영되지 않습니다.
# 예전에는 배포가 이 파일을 /etc/nginx/sites-enabled/default 로 복사했지만,
# 그 설정은 server_name 이 _ 라서 icl-pilates.com 요청을 받지 못했습니다.
# 실제 트래픽은 서버의 /etc/nginx/sites-available/icl 이 처리합니다.
#
# 실서비스 설정은 두 곳으로 나뉘어 있습니다.
#   - deploy/nginx-icl-app.conf        location 등 애플리케이션 설정 (이 저장소가 관리)
#   - 서버 sites-available/icl          TLS·server_name·리다이렉트 (certbot 이 관리)
#     위 파일이 nginx-icl-app.conf 를 include 합니다.
#
# 고칠 일이 있으면 이 파일이 아니라 deploy/nginx-icl-app.conf 를 수정하세요.
# 이 파일은 새 서버를 처음부터 구성할 때 server 블록 예시로만 참고합니다.
# 자세한 배경은 docs/audits/nginx-consolidation-20260821.md 를 보세요.

server {
  listen 80;
  server_name _;

  root /home/ubuntu/ICL/frontend/dist;
  index index.html;

  client_max_body_size 5120m;

  # Vite가 파일명에 해시를 붙인 정적 자산은 장기 캐시합니다.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://localhost:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
  }

  location /uploads/academy/videos/ {
    return 403;
  }

  location /uploads/ {
    alias /home/ubuntu/ICL/backend/uploads/;
    expires 30d;
    add_header Cache-Control "public";
  }

  # SPA 라우팅은 index.html로 돌리고, HTML은 캐시하지 않습니다.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires 0;
    try_files $uri $uri/ /index.html;
  }
}
