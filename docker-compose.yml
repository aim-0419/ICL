services:
  mysql:
    image: mysql:8.4
    container_name: icl-demo-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-icl_pilates}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-icl_demo_root_pw}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: icl-demo-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:${DEMO_FRONTEND_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-icl_demo_root_pw}
      DB_NAME: ${MYSQL_DATABASE:-icl_pilates}
      SITE_URL: http://localhost:${DEMO_FRONTEND_PORT:-8080}
      ACADEMY_PLAYBACK_TOKEN_SECRET: ${ACADEMY_PLAYBACK_TOKEN_SECRET:-demo-playback-token-secret-change-me}
      ACADEMY_PUBLISH_SCHEDULER_ENABLED: "true"
      DEMO_ADMIN_ENABLED: "true"
      DEMO_ADMIN_LOGIN_ID: ${DEMO_ADMIN_LOGIN_ID:-demo-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo-admin-1234}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-demo-admin@icl.local}
      DEMO_ADMIN_NAME: ${DEMO_ADMIN_NAME:-Demo Admin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ICL Pilates <noreply@icl-pilates.local>}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: icl-demo-frontend
    ports:
      - "${DEMO_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql-data:
  backend-uploads:
