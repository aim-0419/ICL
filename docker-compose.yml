x-backend-development-env: &backend-development-env
  NODE_ENV: development
  APP_ENV: development
  TEST_SAFE_MODE: "true"
  PORT: 4000
  CORS_ORIGIN: http://localhost:${DEMO_FRONTEND_PORT:-8080}
  MOBILE_APP_ORIGINS: https://localhost,capacitor://localhost
  SITE_URL: http://localhost:${DEMO_FRONTEND_PORT:-8080}
  UPLOAD_ROOT: uploads-dev
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: homepage_dev_user
  DB_PASSWORD: ${MYSQL_DEV_PASSWORD:?Set MYSQL_DEV_PASSWORD in .env.docker}
  DB_NAME: homepage_dev
  DB_SSL_MODE: disabled
  DB_SSL_CA: ""
  DB_INIT_MODE: safe
  ALLOW_DESTRUCTIVE_MIGRATIONS: "false"
  ALLOW_STARTUP_DATA_PURGE: "false"
  ALLOW_STARTUP_SCHEMA_DROP: "false"
  ALLOW_STARTUP_USER_PURGE: "false"
  ALLOW_STARTUP_SCHEMA_BOOTSTRAP: "false"
  ALLOW_STARTUP_SCHEMA_ALTER: "false"
  ALLOW_STARTUP_DATA_REPAIR: "false"
  ALLOW_E2E_DATA_MUTATION: "false"
  ALLOW_EXTERNAL_EMAIL_SEND: "false"
  ALLOW_EXTERNAL_SMS_SEND: "false"
  ALLOW_EXTERNAL_KAKAO_SEND: "false"
  ALLOW_EXTERNAL_PUSH_SEND: "false"
  ALLOW_EXTERNAL_PAYMENT_CALLS: "false"
  ACADEMY_PUBLISH_SCHEDULER_ENABLED: "false"
  NOTIFICATION_SCHEDULER_ENABLED: "false"
  DEBUG_VERIFICATION_CODES: "false"
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY in .env.docker}
  ACADEMY_PLAYBACK_TOKEN_SECRET: ${ACADEMY_PLAYBACK_TOKEN_SECRET:?Set ACADEMY_PLAYBACK_TOKEN_SECRET in .env.docker}
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  ALIGO_API_KEY: ""
  KAKAO_SENDER_KEY: ""
  FCM_PROJECT_ID: ""
  FCM_CLIENT_EMAIL: ""
  FCM_PRIVATE_KEY: ""
  PORTONE_API_SECRET: ""

services:
  mysql:
    image: mysql:8.4
    container_name: icl-dev-mysql
    environment:
      MYSQL_DATABASE: homepage_dev
      MYSQL_USER: homepage_dev_user
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:?Set MYSQL_DEV_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  db-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./backend
    environment:
      <<: *backend-development-env
      DB_INIT_MODE: bootstrap
      ALLOW_STARTUP_SCHEMA_BOOTSTRAP: "true"
      ALLOW_STARTUP_SCHEMA_ALTER: "true"
    command: ["node", "scripts/bootstrap-development-db.mjs"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: icl-dev-backend
    environment:
      <<: *backend-development-env
    volumes:
      - backend-uploads-dev:/app/uploads-dev
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: icl-dev-frontend
    ports:
      - "${DEMO_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql-dev-data:
  backend-uploads-dev:
